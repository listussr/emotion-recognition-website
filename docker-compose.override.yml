# Dev / демо-оверлей.
# ---
# Подхватывается АВТОМАТИЧЕСКИ при `docker compose up` (без -f), поэтому
# локальная разработка работает как раньше: сайт на http://localhost:8080.
#
# В проде этот файл НЕ используется — там стек поднимают явным набором файлов:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (явные -f отключают авто-подхват override.yml, и 8080 наружу не публикуется).

services:
  frontend:
    ports:
      - "8080:80"
