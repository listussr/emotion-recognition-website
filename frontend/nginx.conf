# nginx-конфиг для контейнера frontend.
# Раздаёт SPA-статику и проксирует /api/ на сервис `backend:8000`
# (имя из docker-compose network).

server {
    listen 80;
    server_name _;

    # Потолок загружаемого файла чуть выше бэкендовского max_file_size_mb (50),
    # чтобы 413 шёл от FastAPI с понятным сообщением, а не от nginx.
    client_max_body_size 60m;

    # ---- API proxy -------------------------------------------------------
    # FastAPI роуты висят под /api/photo и /api/video.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Обработка видео может идти десятки секунд — поднимаем таймауты.
        proxy_connect_timeout 5s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # ---- Статика + SPA fallback -----------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Иммутабельные ассеты Vite с длинным TTL.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router: любой неизвестный путь -> index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
